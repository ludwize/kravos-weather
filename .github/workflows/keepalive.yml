name: keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# This one runs daily, checks that the web edition and its data sources answer,
# and pushes a small status file to the ci-logs branch (that push counts as activity).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check site and data sources
        run: |
          mkdir -p ka
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          {
            date -u +"checked %Y-%m-%dT%H:%M:%SZ"
            for u in "$SITE" \
              "https://api.open-meteo.com/v1/forecast?latitude=44.8&longitude=20.4&current=temperature_2m" \
              "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=44.8&longitude=20.4&current=european_aqi" \
              "https://api.rainviewer.com/public/weather-maps.json"; do
              echo "$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$u") $u"
            done
          } | tee ka/status.txt
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-log.sh keepalive ka
